[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-source-project-audit-kit"
version = "0.1.0"
description = "Evidence-first scoring, validation, and reporting for open-source repository decisions."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "JINGJAYHUANG"}]
keywords = ["open-source", "audit", "due-diligence", "security", "governance", "evidence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
oss-audit = "open_source_audit.cli:main"

[project.urls]
Repository = "https://github.com/JINGJAYHUANG/open-source-project-audit-kit"
Issues = "https://github.com/JINGJAYHUANG/open-source-project-audit-kit/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
open_source_audit = ["data/*.json"]
