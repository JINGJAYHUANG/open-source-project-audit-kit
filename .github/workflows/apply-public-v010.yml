name: Apply Public v0.1.0 Source

on:
  push:
    branches:
      - feat/public-v0.1.0
    paths:
      - .github/workflows/apply-public-v010.yml
      - .bootstrap/**

permissions:
  contents: write

concurrency:
  group: open-source-project-audit-kit-bootstrap
  cancel-in-progress: false

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/public-v0.1.0
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: ""

      - name: Verify and extract audited source payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/oss-audit-unpacked /tmp/oss-audit-payload.tar.gz
          mkdir -p /tmp/oss-audit-unpacked
          cat .bootstrap/part-* | base64 --decode > /tmp/oss-audit-payload.tar.gz
          echo "307d4e999851b3a030242d964c584cf2ed2640b435760295eecc6657f202c5b7  /tmp/oss-audit-payload.tar.gz" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile

          archive_path = Path('/tmp/oss-audit-payload.tar.gz')
          destination = Path('/tmp/oss-audit-unpacked')
          with tarfile.open(archive_path, mode='r:gz') as archive:
              members = archive.getmembers()
              if not members:
                  raise SystemExit('payload archive is empty')
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'unsupported archive member: {member.name}')
              archive.extractall(destination, filter='data')
          PY
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/oss-audit-unpacked/ ./
          rm -rf .bootstrap

      - name: Run complete release gate
        run: python tools/release_check.py

      - name: Commit readable source to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat: publish evidence-backed open-source audit toolkit"
          git push origin HEAD:feat/public-v0.1.0
